<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OneTap</title>
<style>
:root{--bg:#FAFAFA;--sf:#F0EFEA;--ink:#1A1A1A;--mut:#666666;--ln:#DAD8D0;--ac:#2563EB;--on:#FFFFFF;--soft:#E4E2DA;--wr:#C2410C;--bw:1px;--fs:16px;padding-top:env(safe-area-inset-top,0px);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--sf:#1C1C1B;--ink:#FAFAFA;--mut:#A3A3A3;--ln:#2E2E2C;--ac:#60A5FA;--on:#0B1A33;--soft:#232323;--wr:#FB923C}}
:root[data-theme="dark"]{--bg:#121212;--sf:#1C1C1B;--ink:#FAFAFA;--mut:#A3A3A3;--ln:#2E2E2C;--ac:#60A5FA;--on:#0B1A33;--soft:#232323;--wr:#FB923C}
:root[data-hc="1"]{--ink:#000;--mut:#27272a;--ln:#000;--bw:2px;--ac:#1D4ED8}:root[data-hc="1"][data-theme="dark"]{--ink:#fff;--mut:#f4f4f5;--ln:#fff;--bg:#000;--sf:#000;--ac:#93C5FD}
html{font-size:var(--fs);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.mut{color:var(--mut);font-size:.88rem}
button,input,select,textarea{font:inherit;color:var(--ink);background:var(--sf);border:var(--bw) solid var(--ln);border-radius:8px;padding:.55rem .8rem;min-height:44px}
input,textarea,select{width:100%}button{cursor:pointer}button:hover{border-color:var(--ink)}
.pri{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600}.pri:hover{opacity:.9;border-color:var(--ac)}
.gh{background:transparent}a.bt{display:inline-flex;align-items:center;min-height:44px;padding:.4rem .8rem;border:var(--bw) solid var(--ln);border-radius:8px;color:var(--ink);text-decoration:none;background:var(--sf)}a.bt:hover{border-color:var(--ink)}:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:208px 1fr;min-height:100vh}
.sb{position:sticky;top:0;height:100vh;padding:16px 12px;border-inline-end:var(--bw) solid var(--ln);display:flex;flex-direction:column;gap:6px;background:var(--sf)}
.logo{font-weight:700;letter-spacing:-.5px;font-size:1.15rem;padding:4px 8px 12px}.logo b{color:var(--ac)}
.nav{display:flex;flex-direction:column;gap:2px}.nav button{border:0;background:transparent;text-align:left;border-radius:6px}.nav button[aria-current=page]{background:var(--soft);color:var(--ac);font-weight:600}
.tools{margin-top:auto;display:flex;flex-direction:column;gap:6px}.tr{display:flex;gap:6px}.tr>*{flex:1}
main{padding:28px 32px 48px;max-width:900px;width:100%}
h1{font-size:1.6rem;letter-spacing:-.5px;margin:0 0 14px}h2{font-size:1.15rem;margin:0}
.cmd{display:flex;align-items:center;gap:8px;border:var(--bw) solid var(--ln);background:var(--sf);border-radius:10px;padding:4px 4px 4px 12px}.cmd:focus-within{border-color:var(--ac)}.cmd input{border:0;background:transparent;min-height:42px;padding:0 4px}.cmd input:focus-visible{outline:0}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.pill{border-radius:99px;min-height:36px;padding:.2rem .8rem;font-size:.9rem}.pill[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tk{display:inline-block;border:var(--bw) solid var(--ln);border-radius:6px;padding:0 .5rem;font-size:.82rem;margin-right:6px;background:var(--sf)}
.note{border:var(--bw) solid var(--ln);border-left:3px solid var(--ac);border-radius:8px;padding:10px 14px;margin:12px 0;background:var(--sf);display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}
.list{border:var(--bw) solid var(--ln);border-radius:10px;background:var(--sf);overflow:hidden}.rw{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:12px 14px;border-top:var(--bw) solid var(--ln)}.rw:first-child{border-top:0}
.v{color:var(--ac);font-size:.78rem;font-weight:600;border:var(--bw) solid var(--ac);border-radius:4px;padding:0 .35rem;margin-left:6px}
.two{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}.sum{position:sticky;top:20px;border:var(--bw) solid var(--ln);border-radius:10px;padding:14px;background:var(--sf)}.sum dt{color:var(--mut);font-size:.8rem;margin-top:8px}.sum dd{margin:0}
.bc{display:flex;gap:8px;font-size:.88rem;color:var(--mut);margin:8px 0 14px;flex-wrap:wrap}.bc .on{color:var(--ac);font-weight:700}
.box{border:var(--bw) solid var(--ln);border-radius:10px;padding:14px;background:var(--sf);margin-bottom:12px}
.sg{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;margin:10px 0}.sl{font-size:.9rem;padding:.4rem}.sl[aria-pressed=true]{background:var(--ac);color:var(--on);border-color:var(--ac)}.sl.b{text-decoration:line-through;color:var(--mut);border-style:dashed;background:transparent}
.tog{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:var(--bw) solid var(--ln)}
label{display:block;font-size:.85rem;font-weight:600;margin:10px 0 4px}
.au{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.brand{background:#1A1A1A;color:#FAFAFA;padding:32px 48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.brand .logo{padding:0;font-size:1.25rem}.brand .logo b{color:#7AA7F7}
.brand h1{font-size:2.6rem;line-height:1.1;letter-spacing:-1.2px;margin:0 0 28px;max-width:14ch}
.how{list-style:none;padding:0;margin:0;display:grid;gap:12px;font-size:.92rem;color:#B5B5B5}.how li{display:flex;gap:14px}.how i{font-style:normal;color:#7AA7F7}
.brand .mut{color:#8A8A8A;margin:0}
.fm{padding:20px 48px 32px;display:flex;flex-direction:column}
.tb{display:flex;gap:6px;justify-content:flex-end}.tb select{width:auto}.tb button{min-width:44px}
.fw{margin:auto 0;width:100%;max-width:360px}
.fw h2{font-size:1.5rem;letter-spacing:-.4px;margin:0 0 4px}.fw>.mut{margin:0 0 20px}
.ul{display:flex;gap:20px;border-bottom:var(--bw) solid var(--ln);margin-bottom:20px}.ul button{border:0;border-radius:0;background:transparent;padding:.5rem 0;min-height:40px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--mut)}.ul button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--ac);font-weight:600}
.fw form{display:flex;flex-direction:column;gap:14px}.fw label{margin:0 0 4px}.fw form .mut{margin:0}.fw form .mut:empty{display:none}
.alt2{display:flex;justify-content:space-between;margin-top:20px;font-size:.9rem}.alt2 button{border:0;background:transparent;color:var(--ac);padding:0;min-height:36px;font-weight:600;text-decoration:underline;text-underline-offset:3px}
@media(max-width:800px){.au{grid-template-columns:1fr}.brand{padding:20px 20px 24px;gap:20px}.brand h1{font-size:1.8rem;margin:0}.how,.brand>.mut{display:none}.fm{padding:20px}.fw{margin:8px 0 0}}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:20}#toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem}
.pop{position:fixed;right:16px;top:16px;width:min(300px,92vw);z-index:15;border:var(--bw) solid var(--ln);border-radius:10px;padding:14px;background:var(--sf)}
@media(max-width:800px){.app{grid-template-columns:1fr}.sb{height:auto;flex-direction:row;align-items:center;border-right:0;border-bottom:var(--bw) solid var(--ln);padding:8px 12px}.logo{padding:0;margin-right:auto}
.tools{margin:0;flex-direction:row}.tools .tr{display:contents}.tools select{width:auto}.tools .u{padding:.3rem .7rem;min-height:40px}.tools select{max-width:104px}
.nav{position:fixed;bottom:0;left:0;right:0;flex-direction:row;background:var(--sf);border-top:var(--bw) solid var(--ln);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));z-index:10}.nav button{flex:1;text-align:center;font-size:.85rem}
main{padding:16px 14px 90px}.two{grid-template-columns:1fr}.sum{position:static;order:-1}.rw{grid-template-columns:1fr auto}.rw .m{grid-column:1}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* responsive: phone <800, tablet 801-1099 (top bar), desktop 1100+ (sidebar + sticky map) */
h1{font-size:clamp(1.4rem,3.2vw,1.9rem)}main{padding:clamp(14px,3vw,32px)}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{border:var(--bw) solid var(--ln);border-radius:10px;background:var(--sf);padding:12px 14px;display:flex;flex-direction:column;gap:3px;min-width:0}.pc.best{border-color:var(--ac)}
.ph{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.ph b{overflow-wrap:anywhere}.ba{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sh{font-size:1.1rem;margin:22px 0 8px}.pl{display:grid;gap:14px}.pm,.pr{min-width:0}
@media(pointer:coarse){.pill{min-height:44px}}
@media(min-width:801px) and (max-width:1099px){.app{grid-template-columns:1fr}.sb{position:sticky;top:0;height:auto;z-index:9;flex-direction:row;align-items:center;border-inline-end:0;border-bottom:var(--bw) solid var(--ln);padding:8px 20px}.logo{padding:0;margin-inline-end:12px}.nav{flex-direction:row}.tools{margin:0;margin-inline-start:auto;flex-direction:row}.tools .tr{display:contents}.tools select{width:auto}}
@media(min-width:1100px){main{max-width:1180px}.pl{grid-template-columns:minmax(0,1fr) 380px}.pm{order:2;position:sticky;top:16px;align-self:start}}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(240px,1fr);gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;overscroll-behavior-x:contain}.hs>.pc{scroll-snap-align:start}
@media(max-width:600px){.hs{grid-auto-columns:78%}}
.ph .m{white-space:nowrap;font-size:.85rem}.tools button,.tools select{white-space:nowrap;font-size:.9rem}@media(max-width:800px){.tools button,.tools select{padding:.4rem .6rem}.tools .tr{display:contents}.sb{gap:6px}}
.app>*{min-width:0}.app{grid-template-columns:208px minmax(0,1fr)}
@media(max-width:1099px){.app{grid-template-columns:minmax(0,1fr)}}
svg{direction:ltr}html[dir=rtl] .pc .mut,html[dir=rtl] .pc .m{unicode-bidi:plaintext;text-align:start}
html:lang(kn),html:lang(ta),html:lang(te),html:lang(ml),html:lang(hi),html:lang(mr),html:lang(bn){line-height:1.7}
</style></head>
